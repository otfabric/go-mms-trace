name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Organisation checks: format, lint, vet, vulnerabilities, race tests, coverage.
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      coverage-min: "90"
      coverpkg: "./..."
      # TESTING.md: 30 s per target.
      fuzz-time: 30s
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: go-mms-trace
      go-versions: '["1.26", "1.27"]'
      policy-version: v1.4.2
    secrets: inherit

  # The CLI is a nested module.
  cli:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      module-dir: cmd/mmstracectl
      coverage-min: "90"
      test-exclude-regex: "/example(s)?($|/)"
      run-codecov: false
      go-versions: '["1.26", "1.27"]'
      policy-version: v1.4.2
    secrets: inherit

  # Every target builds and tests with CGO_ENABLED=0 on a runner of its own
  # architecture. linux/arm (v7) has no hosted runner, so it is
  # cross-compiled on the arm64 runner and not executed. Every Linux job
  # checks with `file` that mmstracectl is statically linked.
  targets:
    name: Target ${{ matrix.os }}/${{ matrix.arch }}${{ matrix.goarm && 'v7' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, test: true }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, test: true }
          - { os: linux, arch: arm, goarm: "7", runner: ubuntu-24.04-arm, test: false }
          - { os: darwin, arch: arm64, runner: macos-latest, test: true }
          - { os: darwin, arch: amd64, runner: macos-15-intel, test: true }
          - { os: windows, arch: amd64, runner: windows-latest, test: true }
          - { os: windows, arch: arm64, runner: windows-11-arm, test: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: No replace directives
        run: make mod-check
      - name: Build
        run: |
          go build ./...
          (cd cmd/mmstracectl && go build -o "$RUNNER_TEMP/" ./...)
      - name: Test
        if: matrix.test
        run: |
          go test -count=1 ./...
          (cd cmd/mmstracectl && go test -count=1 ./...)
      - name: Static binary
        if: matrix.os == 'linux'
        run: |
          (cd cmd/mmstracectl && go build -trimpath -o ../../mmstracectl .)
          file mmstracectl
          file mmstracectl | grep -q 'statically linked'

  # The per-package coverage floor.
  coverage-packages:
    name: Per-package coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make coverage-pkg-check
